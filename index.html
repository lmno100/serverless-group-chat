<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>serverless group chat</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px system-ui, sans-serif; background: #0b0e14; color: #d7dce5; }
  header { padding: 10px 16px; background: #131824; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  header b { color: #6cb6ff; }
  input, button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #2b3242; background: #1b2130; color: #d7dce5; }
  button { cursor: pointer; background: #244; border-color: #366; }
  button:hover { background: #366; }
  #roomLink { flex: 1; min-width: 200px; }
  main { display: grid; grid-template-columns: 1fr 320px; gap: 12px; padding: 12px; height: calc(100vh - 120px); }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; align-content: start; overflow: auto; }
  .tile { position: relative; background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 4/3; }
  .tile video { width: 100%; height: 100%; object-fit: cover; }
  .tile span { position: absolute; left: 6px; bottom: 6px; background: #000a; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  aside { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #chat { flex: 1; background: #0f1420; border-radius: 8px; padding: 8px; white-space: pre-wrap; overflow: auto; font-size: 13px; }
  .row { display: flex; gap: 6px; } .row input { flex: 1; }
  #log { height: 96px; overflow: auto; background: #0f1420; border-radius: 8px; padding: 8px; font: 11px ui-monospace, monospace; color: #8b93a7; white-space: pre-wrap; }
  footer { padding: 6px 16px; font-size: 12px; color: #6b7385; }
</style>
</head>
<body>
<header>
  <b>serverless group chat</b>
  <span>you: <b id="me">…</b></span>
  <input id="roomLink" readonly>
  <button id="copyBtn">copy invite link</button>
  <button id="micBtn" title="transcribe your speech and send it to the room as text">🎤 transcribe: off</button>
</header>
<main>
  <div id="grid"></div>
  <aside>
    <div id="chat"></div>
    <div class="row"><input id="msg" placeholder="message everyone…"><button id="sendBtn">send</button></div>
    <div id="log"></div>
  </aside>
</main>
<footer>
  No server of ours: signaling rides a public MQTT broker (or same-machine BroadcastChannel with <code>#room=X&local</code>),
  media is peer-to-peer WebRTC, and every frame is AES-GCM end-to-end encrypted (SFrame / RFC 9605).
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
